<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>더캐리(KR/캐리마켓) 소재별 성과 — 2026-09-02 ~ 2026-09-02</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif; background:#f5f5f5; color:#1a1a1a; }
.header { background:#1a1a2e; color:#fff; padding:28px 40px; }
.header h1 { font-size:20px; font-weight:700; margin-bottom:6px; }
.header p { font-size:12px; opacity:.65; }
.meta { display:flex; gap:20px; margin-top:14px; flex-wrap:wrap; }
.meta-item { font-size:12px; } .meta-item span { font-weight:700; color:#7dd3fc; }
.summary-bar { background:#1e293b; color:#fff; padding:10px 40px; display:flex; gap:28px; font-size:12px; flex-wrap:wrap; }
.summary-item span { color:#94a3b8; } .summary-item strong { color:#f0f9ff; }
.filter-wrap { position:sticky; top:0; z-index:10; background:#fff; border-bottom:2px solid #e5e7eb; box-shadow:0 2px 6px rgba(0,0,0,.06); }
.filter-bar { background:#fff; padding:8px 40px; display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid #f1f5f9; }
.filter-bar:last-child { border-bottom:none; }
.filter-group { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.filter-sep { width:1px; background:#e5e7eb; margin:0 4px; align-self:stretch; }
.filter-label { font-size:10px; color:#94a3b8; font-weight:700; white-space:nowrap; }
.filter-btn { padding:4px 10px; border-radius:20px; border:1.5px solid #d1d5db; background:#fff; cursor:pointer; font-size:11px; font-weight:600; transition:all .15s; }
.filter-btn:hover { background:#f3f4f6; }
.filter-btn.active { background:#1a1a2e; color:#fff; border-color:#1a1a2e; }
.filter-btn.active-green { background:#16a34a; color:#fff; border-color:#16a34a; }
.filter-btn.active-red { background:#dc2626; color:#fff; border-color:#dc2626; }
.filter-btn.campaign-btn { max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; padding:20px 40px; }
.card { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); transition:box-shadow .15s; }
.card:hover { box-shadow:0 4px 14px rgba(0,0,0,.12); }
.card.hidden { display:none; }
.card-img { width:100%; height:200px; object-fit:contain; background:#f8f8f8; display:block; }
.card-img-placeholder { width:100%; height:200px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px; }
.card-body { padding:12px 14px 14px; }
.card-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; color:#fff; }
.run-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; }
.run-active { background:#dcfce7; color:#16a34a; }
.run-inactive { background:#fee2e2; color:#dc2626; }
.card-title { font-size:12px; font-weight:700; margin-bottom:4px; line-height:1.4; word-break:break-all; }
.card-sub { font-size:10px; color:#6b7280; margin-bottom:10px; line-height:1.4; }
.metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.metric { background:#f8fafc; border-radius:6px; padding:6px 8px; text-align:center; }
.metric-label { font-size:9px; color:#94a3b8; font-weight:600; margin-bottom:2px; }
.metric-value { font-size:12px; font-weight:700; color:#1e293b; }
.metric.lead .metric-value { color:#16a34a; }
.metric.warn .metric-value { color:#dc2626; }
@media(max-width:600px) { .header,.filter-bar,.grid,.summary-bar { padding-left:16px; padding-right:16px; } .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="header">
  <h1>더캐리(KR/캐리마켓) 소재별 성과 리포트</h1>
  <p>Meta DA 광고 레벨 | 노출 &gt; 0 소재 전체</p>
  <div class="meta">
    <div class="meta-item">기간: <span>2026-09-02 ~ 2026-09-02</span></div>
    <div class="meta-item">소재 수: <span>0개</span></div>
    <div class="meta-item">🟢 운영중: <span>0개</span></div>
    <div class="meta-item">🔴 중단: <span>0개</span></div>
    
  </div>
</div>
<div class="summary-bar">
  <div class="summary-item"><span>총 비용 </span><strong>0원</strong></div>
  <div class="summary-item"><span>전체 노출 </span><strong>0</strong></div>
  <div class="summary-item"><span>전체 클릭 </span><strong>0</strong></div>
  <div class="summary-item"><span>전체 CTR </span><strong>0.00%</strong></div>
  <div class="summary-item"><span>전체 CPC </span><strong>0원</strong></div>
  <div class="summary-item"><span>총 구매 </span><strong>0건</strong></div>
  <div class="summary-item"><span>전체 CVR </span><strong>0.00%</strong></div>
  <div class="summary-item"><span>전체 CPA </span><strong>0원</strong></div>
  <div class="summary-item"><span>총 수익 </span><strong>0원</strong></div>
  <div class="summary-item"><span>전체 ROAS </span><strong>0%</strong></div>
  <div class="summary-item"><span>최다 구매 </span><strong> (0건)</strong></div>
</div>
<div class="filter-wrap">
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">운영상태</span>
      <button class="filter-btn active-btn active" onclick="filterActive('all',this)">전체</button>
      <button class="filter-btn active-btn" onclick="filterActive('active',this)">🟢 운영중 (0)</button>
      <button class="filter-btn active-btn" onclick="filterActive('inactive',this)">🔴 중단 (0)</button>
      
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">성과</span>
      <button class="filter-btn opinion-btn active" onclick="filterOpinion('all',this)">전체 <span id="visible-count">0개</span></button>
      <button class="filter-btn opinion-btn" onclick="filterOpinion('roas',this)">✅ ROAS 흑자 (0)</button>
      <button class="filter-btn opinion-btn" onclick="filterOpinion('purchase',this)">📊 구매 발생 (0)</button>
      <button class="filter-btn opinion-btn" onclick="filterOpinion('traffic',this)">🔄 유입형 (0)</button>
      <button class="filter-btn opinion-btn" onclick="filterOpinion('off',this)">❌ 저성과 (0)</button>
    </div>
  </div>
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">캠페인</span>
      <button class="filter-btn campaign-btn active" onclick="filterCampaign('all',this)">전체</button>
      
    </div>
  </div>
</div>
<div class="grid" id="grid">

</div>
<script>
let _opinionFilter  = 'all';
let _activeFilter   = 'all';
let _campaignFilter = 'all';

function applyFilters() {
  document.querySelectorAll('.card').forEach(c => {
    const op  = c.dataset.opinion  || '';
    const act = c.dataset.active   || '';
    const cmp = c.dataset.campaign || '';
    let hide = false;
    if (_opinionFilter !== 'all') {
      const map = {roas:'✅', purchase:'📊', traffic:'🔄', off:'❌'};
      if (!op.includes(map[_opinionFilter])) hide = true;
    }
    if (_activeFilter === 'active'   && act !== '1')    hide = true;
    if (_activeFilter === 'inactive' && act !== '0')    hide = true;
    if (_activeFilter === 'unknown'  && act !== 'null') hide = true;
    if (_campaignFilter !== 'all' && cmp !== _campaignFilter) hide = true;
    c.classList.toggle('hidden', hide);
  });
  updateCount();
}
function updateCount() {
  const visible = document.querySelectorAll('.card:not(.hidden)').length;
  const el = document.getElementById('visible-count');
  if (el) el.textContent = visible + '개';
}
function filterOpinion(type, btn) {
  document.querySelectorAll('.opinion-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); _opinionFilter = type; applyFilters();
}
function filterActive(type, btn) {
  document.querySelectorAll('.active-btn').forEach(b => b.classList.remove('active','active-green','active-red'));
  if (type === 'active') btn.classList.add('active-green');
  else if (type === 'inactive') btn.classList.add('active-red');
  else btn.classList.add('active');
  _activeFilter = type; applyFilters();
}
function filterCampaign(name, btn) {
  document.querySelectorAll('.campaign-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); _campaignFilter = name; applyFilters();
}
</script>
</body>
</html>
